name: Build, Analyze & Deploy Docker Images

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Frontend dependencies
        working-directory: ./Frontend/react-project
        run: npm install

      - name: Build Backend with Maven
        working-directory: ./Backend/games-project
        run: mvn clean install -DskipTests

      - name: Launch Unit Tests for Backend Services
        working-directory: ./Backend/games-project
        run: mvn verify

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Unit Tests and Generate Coverage
        working-directory: ./Backend/games-project
        run: mvn clean test jacoco:report

      - name: SonarCloud Analysis
        working-directory: ./Backend/games-project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=FrancescoTorino1999_PlayWiseDependability \
            -Dsonar.organization=francescotorino1999 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml


      - name: Make Docker script executable
        run: chmod +x Docker-info.sh

      - name: Log in to DockerHub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Run Docker-info.sh
        run: ./Docker-info.sh

      - name: Run PIT Mutation Testing
        working-directory: ./Backend/games-project
        run: mvn org.pitest:pitest-maven:mutationCoverage -DwithHistory

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: ./Backend/games-project
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=FrancescoTorino1999_PlayWiseDependability \
          -Dsonar.organization=francescotorino1999 \
          -Dsonar.host.url=https://sonarcloud.io

      - name: Security Scan with Snyk
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
